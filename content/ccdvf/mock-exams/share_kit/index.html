<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCDV-F Study Kit</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede6; --text: #1d1c1a; --muted: #6b675e;
    --border: #dcd8cc; --accent: #c8582f; --on-accent: #fff; --accent-soft: #f6e3da; --ok: #2f7d4f; --ok-soft: #dcefe3;
    --bad: #b3372f; --code-bg: #f1eee6; --link: #a8461f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151c1d; --surface: #192223; --surface-2: #212c2d; --text: #d3dcd6; --muted: #99aaa1;
      --border: #344037; --accent: #bde993; --on-accent: #1d2a16; --accent-soft: #bde9931a; --ok: #9bd97f; --ok-soft: #9bd97f1c;
      --bad: #ff9d94; --code-bg: #0f1519; --link: #c3e3a0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151c1d; --surface: #192223; --surface-2: #212c2d; --text: #d3dcd6; --muted: #99aaa1;
    --border: #344037; --accent: #bde993; --on-accent: #1d2a16; --accent-soft: #bde9931a; --ok: #9bd97f; --ok-soft: #9bd97f1c;
    --bad: #ff9d94; --code-bg: #0f1519; --link: #c3e3a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--link); }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: 100vh; height: 100dvh; }
  /* sidebar */
  .side { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 14px 10px 30px; }
  .brand { display: block; padding: 6px 10px 12px; text-decoration: none; color: var(--text); }
  .brand b { display: block; font-size: 1.05rem; }
  .brand span { font-size: .78rem; color: var(--muted); }
  .part { margin-top: 12px; }
  .part-name { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; }
  .item { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: .88rem; text-decoration: none; color: var(--text); }
  .item:hover { background: var(--surface-2); }
  .item.cur { background: var(--accent-soft); font-weight: 600; }
  .item .num { flex: 0 0 auto; min-width: 28px; color: var(--muted); font-size: .78rem; }
  .item .t { flex: 1; }
  .item .tick { color: var(--ok); font-size: .8rem; }
  .item .score { font-size: .72rem; color: var(--muted); white-space: nowrap; }
  /* main */
  .main { display: flex; flex-direction: column; min-width: 0; height: 100vh; height: 100dvh; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--surface); min-height: 50px; }
  .topbar .title { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: .88rem; text-decoration: none; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
  .menu-btn { display: none; }
  .scroll { flex: 1; overflow-y: auto; }
  .doc { max-width: 820px; margin: 0 auto; padding: 28px 28px 60px; }
  .doc h1, .doc h2 { line-height: 1.25; letter-spacing: -.01em; }
  .doc h2 { font-size: 1.6rem; margin-top: 0; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .doc h3 { font-size: 1.2rem; margin-top: 2em; }
  .doc h4 { font-size: 1.02rem; margin-top: 1.6em; }
  .doc p, .doc li { line-height: 1.75; }
  .doc code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .86em; background: var(--code-bg); padding: .12em .35em; border-radius: 4px; }
  .doc pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; line-height: 1.55; }
  .doc pre code { background: none; padding: 0; font-size: .84em; }
  .doc blockquote { margin: 1em 0; padding: 8px 18px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; }
  .table-wrap { overflow-x: auto; margin: 1em 0; }
  .doc table { border-collapse: collapse; width: 100%; font-size: .92em; }
  .doc th, .doc td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--surface-2); }
  .doc hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  .pager { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--border); }
  .pager .btn { max-width: 48%; }
  /* home */
  .hero h1 { font-size: 1.9rem; margin: 0 0 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 20px 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card b.big { display: block; font-size: 1.6rem; }
  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); }
  .muted { color: var(--muted); }
  .exam-list { display: grid; gap: 8px; }
  .exam-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--text); }
  .exam-row:hover { border-color: var(--accent); }
  .exam-row .s { flex: 1; font-weight: 600; }
  .pill { font-size: .75rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .pill.pass { background: var(--ok-soft); color: var(--ok); }
  .pill.fail { background: #b3372f22; color: var(--bad); }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px #0006; }
    .side.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .doc { padding: 20px 16px 50px; }
    .pager .btn { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="side" id="side" aria-label="Chapters"></nav>
  <div class="main">
    <div class="topbar">
      <button class="btn menu-btn" id="menu" aria-label="Open chapter menu">☰</button>
      <div class="title" id="title"></div>
      <button class="btn" id="theme" title="Toggle light/dark">◐</button>
    </div>
    <div class="scroll" id="scroll"><div class="doc" id="doc"></div></div>
  </div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="data/handbook.js"></script>
<script>
(function () {
  "use strict";
  var KIT = window.KIT;
  var side = document.getElementById("side"), doc = document.getElementById("doc");
  var scroller = document.getElementById("scroll"), titleEl = document.getElementById("title");

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  var flat = [];
  KIT.parts.forEach(function (p) { p.items.forEach(function (it) { it.part = p.name; flat.push(it); }); });
  var readable = flat.filter(function (it) { return it.kind === "chapter"; });
  var byId = {};
  flat.forEach(function (it) { byId[it.id] = it; });

  function readMap() { return load("ccdvf-kit-read", {}); }
  function bestScores() {
    var best = {};
    load("ccdvf-mock-history", []).forEach(function (h) {
      if (h.mode !== "exam" || !h.scaled) return;
      best[h.set] = Math.max(best[h.set] || 0, h.scaled);
    });
    return best;
  }
  function examHref(it) { return "exam.html?set=" + it.set + "&home=index.html"; }

  function renderSide(currentId) {
    var read = readMap(), best = bestScores();
    side.innerHTML = '<a class="brand" href="#/"><b>' + esc(KIT.title) + "</b><span>" + esc(KIT.subtitle) + "</span></a>" +
      KIT.parts.map(function (p) {
        return '<div class="part"><div class="part-name">' + esc(p.name) + "</div>" + p.items.map(function (it) {
          if (it.kind === "exam") {
            var b = best[it.set];
            return '<a class="item" href="' + examHref(it) + '"><span class="num">' + esc(it.num) + '</span><span class="t">' + esc(it.title) + " ↗</span>" +
              (b ? '<span class="score">' + b + "</span>" : "") + "</a>";
          }
          return '<a class="item' + (it.id === currentId ? " cur" : "") + '" href="#/c/' + it.id + '"><span class="num">' + esc(it.num) + '</span><span class="t">' + esc(it.title) + "</span>" +
            (read[it.id] ? '<span class="tick" title="Read">✓</span>' : "") + "</a>";
        }).join("") + "</div>";
      }).join("");
  }

  function renderHome() {
    var read = readMap(), best = bestScores();
    var done = readable.filter(function (it) { return read[it.id]; }).length;
    var next = readable.find(function (it) { return !read[it.id]; }) || readable[0];
    var exams = flat.filter(function (it) { return it.kind === "exam"; });
    titleEl.textContent = KIT.title;
    doc.innerHTML =
      '<div class="hero"><h1>' + esc(KIT.title) + '</h1><div class="muted">' + esc(KIT.subtitle) + "</div></div>" +
      '<div class="cards">' +
      '<div class="card"><span class="muted">Chapters read</span><b class="big">' + done + " / " + readable.length + '</b><div class="bar"><div style="width:' + (100 * done / readable.length) + '%"></div></div></div>' +
      '<div class="card"><span class="muted">Mock exams passed</span><b class="big">' + exams.filter(function (e) { return (best[e.set] || 0) >= 720; }).length + " / " + exams.length + "</b><span class=\"muted\">720 / 1000 to pass</span></div>" +
      '<div class="card"><span class="muted">' + (done ? "Continue with" : "Start with") + '</span><div style="margin-top:6px"><a class="btn primary" href="#/c/' + next.id + '">' + esc(next.num + " · " + next.title) + "</a></div></div>" +
      "</div>" +
      "<h3>How to use this kit</h3>" +
      "<p>Read the handbook in order (it starts with <a href=\"#/c/" + readable[0].id + "\">How to Use This Handbook</a>), then take the mock exams under timed conditions. " +
      "Each exam is 53 questions in 120 minutes and ends with a score report. Afterwards, the matching <i>Answer Key</i> chapter explains every question. " +
      "See <a href=\"#/c/" + (flat.find(function (it) { return /guide/.test(it.id); }) || readable[0]).id + "\">the mock exam guide</a> for a suggested plan.</p>" +
      "<p class=\"muted\">Your progress and scores are saved in this browser only. Nothing is uploaded anywhere.</p>" +
      "<h3>Mock exams</h3><div class=\"exam-list\">" + exams.map(function (e) {
        var b = best[e.set];
        return '<a class="exam-row" href="' + examHref(e) + '"><span class="s">' + esc(e.title) + "</span>" +
          (b ? '<span class="pill ' + (b >= 720 ? "pass" : "fail") + '">Best ' + b + " · " + (b >= 720 ? "Pass" : "Fail") + "</span>" : '<span class="pill">Not taken</span>') + "<span>→</span></a>";
      }).join("") + "</div>";
    renderSide(null);
    scroller.scrollTop = 0;
  }

  function renderChapter(id) {
    var it = byId[id];
    if (!it || it.kind !== "chapter") return renderHome();
    titleEl.textContent = it.num + " · " + it.title;
    var html = marked.parse(it.md, { gfm: true });
    var i = readable.indexOf(it), prev = readable[i - 1], next = readable[i + 1];
    var isRead = !!readMap()[id];
    doc.innerHTML = html +
      '<div class="pager">' +
      (prev ? '<a class="btn" href="#/c/' + prev.id + '">← ' + esc(prev.title) + "</a>" : "<span></span>") +
      '<button class="btn' + (isRead ? " done" : "") + '" id="markRead">' + (isRead ? "✓ Read" : "Mark as read") + "</button>" +
      (next ? '<a class="btn primary" href="#/c/' + next.id + '">' + esc(next.title) + " →</a>" : '<a class="btn primary" href="#/">Home →</a>') +
      "</div>";
    doc.querySelectorAll("table").forEach(function (t) {
      var w = document.createElement("div"); w.className = "table-wrap"; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    // Links inside chapters: exam links open the local exam page; other web links open in a new tab.
    doc.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href");
      if (/^https?:/.test(h)) { a.target = "_blank"; a.rel = "noopener"; }
    });
    document.getElementById("markRead").onclick = function () {
      var r = readMap();
      if (r[id]) delete r[id]; else r[id] = true;
      save("ccdvf-kit-read", r);
      var keep = scroller.scrollTop;
      renderChapter(id);
      scroller.scrollTop = keep;
    };
    renderSide(id);
    var pos = load("ccdvf-kit-scroll", {})[id] || 0;
    scroller.scrollTop = pos;
    save("ccdvf-kit-last", id);
  }

  var saveTimer;
  scroller.addEventListener("scroll", function () {
    var m = /^#\/c\/(.+)$/.exec(location.hash);
    if (!m) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var s = load("ccdvf-kit-scroll", {}); s[m[1]] = scroller.scrollTop; save("ccdvf-kit-scroll", s);
    }, 300);
  }, { passive: true });

  function route() {
    side.classList.remove("open");
    var m = /^#\/c\/(.+)$/.exec(location.hash);
    if (m) renderChapter(decodeURIComponent(m[1])); else renderHome();
  }
  window.addEventListener("hashchange", route);
  document.getElementById("menu").onclick = function () { side.classList.toggle("open"); };
  document.getElementById("theme").onclick = function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    save("ccdvf-kit-theme", root.dataset.theme);
  };
  var theme = load("ccdvf-kit-theme", null);
  if (theme) document.documentElement.dataset.theme = theme;
  route();
})();
</script>
</body>
</html>
