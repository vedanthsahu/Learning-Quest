name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-src/package-lock.json

      - name: Install dependencies
        working-directory: app-src
        run: npm ci

      - name: Build (static, base path /Learning-Quest/)
        working-directory: app-src
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # The built app fetches chapter markdown and the catalog-only seed data
      # as plain static files, not bundled imports -- so they're copied
      # alongside the Vite output rather than built by it. data.json (the
      # real, personal save file) is never committed to this repo and is
      # therefore never part of this build.
      - name: Assemble the published site
        run: |
          cp -r content dist-pages/content
          cp data.seed.json dist-pages/data.seed.json
          touch dist-pages/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
